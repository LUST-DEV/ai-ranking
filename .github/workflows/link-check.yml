name: Link check
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: link-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - name: Check official links (report only, never edits data)
        id: links
        run: npm run check-links | tee link-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: |
            link-report.json
            link-summary.txt
          retention-days: 30
      - name: Open or update a review issue when links need attention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -qE "^Checked [0-9]+ links, [1-9][0-9]* need review" link-summary.txt; then
            title="Link check: links need review"
            body="$(printf 'Automated report from run %s.\n\nFailures can be false positives (bot blocking, regional restrictions). Review manually; do not bulk-edit data.\n\n```\n%s\n```' "$GITHUB_RUN_ID" "$(head -c 6000 link-summary.txt)")"
            existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
            if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          fi
